<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  {%- assign default_theme = page.theme | default: site.site_theme | default: 'ocean' -%}
  <script>
    // Apply the theme before the page paints, so there is no flash.
    // Order: the visitor's saved pick > page front matter "theme:" > _config.yml "site_theme".
    (function () {
      var t = '{{ default_theme }}';
      try { t = localStorage.getItem('site-theme') || t; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-default-theme', '{{ default_theme }}');
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/themes.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
