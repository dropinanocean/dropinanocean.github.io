<div class="theme-switch">
  <label for="theme-select" class="theme-icon" title="Theme">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
    <span class="visually-hidden">Theme</span>
  </label>
  <select id="theme-select" title="Change theme (T = next, Shift+T = previous)">
    {% assign groups = site.data.themes | group_by: "group" %}
    {% for g in groups %}
      <optgroup label="{{ g.name }}">
        {% for t in g.items %}<option value="{{ t.name }}">{{ t.label }}</option>{% endfor %}
      </optgroup>
    {% endfor %}
  </select>
</div>
